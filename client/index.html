<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dionysus — AI-powered developer collaboration platform" />
  <title>Dionysus — Developer Collaboration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("dionysus-theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        var dark;
        if (stored === "light") dark = false;
        else if (stored === "dark") dark = true;
        else if (prefersDark) dark = true;
        else if (prefersLight) dark = false;
        else dark = true;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
